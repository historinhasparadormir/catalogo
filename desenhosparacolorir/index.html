        .slides {

        }

        /* Navegao do slider */
        .navigation {
	position: absolute;
	top: 50%;
	width: 420px;
	transform: translateY(-50%);
	pointer-events: none;
        }

        .navigation label {
            display: none;
            cursor: pointer;
            position: absolute;
            top: 0;
            padding: 15px;
            background-color: rgba(143, 188, 143, 0.7);
            color: white;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            transition: background-color 0.3s ease;
            pointer-events: auto;
        }

        .navigation label.prev {
            left: 0;
            border-radius: 0 50px 50px 0;
        }

        .navigation label.next {
            right: 0;
            border-radius: 50px 0 0 50px;
        }

        .navigation label:hover {
            background-color: rgba(119, 157, 119, 1);
        }

        /* Lgica do slider */
        #slide1:checked ~ .slides { transform: translateX(0%); }
        #slide2:checked ~ .slides { transform: translateX(-16.666%); } /* Corrigido */
        #slide3:checked ~ .slides { transform: translateX(-33.333%); } /* Corrigido */
        #slide4:checked ~ .slides { transform: translateX(-50%); } /* Corrigido */
        #slide5:checked ~ .slides { transform: translateX(-66.666%); } /* Corrigido */
        #slide6:checked ~ .slides { transform: translateX(-83.333%); } /* Adicionado */

        #slide1:checked ~ .navigation .next[for="slide2"],
        #slide1:checked ~ .navigation .prev[for="slide6"] { display: block; }

        #slide2:checked ~ .navigation .next[for="slide3"],
        #slide2:checked ~ .navigation .prev[for="slide1"] { display: block; }

        #slide3:checked ~ .navigation .next[for="slide4"],
        #slide3:checked ~ .navigation .prev[for="slide2"] { display: block; }

        #slide4:checked ~ .navigation .next[for="slide5"],
        #slide4:checked ~ .navigation .prev[for="slide3"] { display: block; }

        #slide5:checked ~ .navigation .next[for="slide6"],
        #slide5:checked ~ .navigation .prev[for="slide4"] { display: block; }

        #slide6:checked ~ .navigation .next[for="slide1"],
        #slide6:checked ~ .navigation .prev[for="slide5"] { display: block; }

<script>
    // Aguarda o contedo da pgina carregar completamente
    document.addEventListener('DOMContentLoaded', function() {

        // --- LGICA DO SLIDER AUTOMTICO ---

        const slideInterval = 3000; // Define o intervalo em milissegundos (2000 = 2 segundos)
        let autoSlideTimer; // Varivel para controlar o tempo

        // Funo que inicia ou reinicia o slideshow automtico
        function startAutoSlider() {
            // Primeiro, limpa qualquer timer que j exista para no criar vrios ao mesmo tempo
            clearInterval(autoSlideTimer);

            // Cria um novo timer que executar a funo de trocar de slide a cada 2 segundos
            autoSlideTimer = setInterval(() => {
                // Encontra qual  o slide que est selecionado no momento
                const currentRadio = document.querySelector('.slideshow-container input[type="radio"]:checked');
                
                // Encontra o prximo "irmo" do slide atual que seja um input (o prximo slide)
                let nextRadio = currentRadio.nextElementSibling;
                while(nextRadio && nextRadio.nodeName !== 'INPUT') {
                    nextRadio = nextRadio.nextElementSibling;
                }

                // Se no houver um prximo (ou seja, se j estiver no ltimo slide)
                if (!nextRadio) {
                    // Volta para o primeiro slide, criando o efeito de loop
                    nextRadio = document.querySelector('.slideshow-container input[type="radio"]');
                }

                // Marca o prximo slide como selecionado, o que faz a imagem trocar
                nextRadio.checked = true;

            }, slideInterval);
        }

        // Pega o container do slider
        const sliderContainer = document.querySelector('.slideshow-container');

        // Adiciona um "ouvinte" que reinicia o timer sempre que houver um clique nos botes
        // Isso garante que, se a pessoa trocar a foto manualmente, a contagem de 2 segundos recomea.
        sliderContainer.addEventListener('click', startAutoSlider);

        // Inicia o slideshow automtico pela primeira vez quando a pgina carrega
        startAutoSlider();
    });
</script>

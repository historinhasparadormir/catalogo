        /* --- ESTILOS GERAIS E DE LAYOUT --- */
        body {
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            /* O padding que criava o espaço no topo foi removido. */
            padding: 0;

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            max-width: 420px;

        .slideshow-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            aspect-ratio: 4 / 3;
        }
        .slides {
            display: flex;
            width: 600%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            width: 16.666%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .slideshow-container input { display: none; }
        .navigation {
            position: absolute;
            top: 50%;
            width: 420px;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .navigation label {
            display: none; cursor: pointer; position: absolute; top: 0; padding: 15px;
            background-color: rgba(143, 188, 143, 0.7);
            color: white; font-size: 24px; font-weight: bold; user-select: none;
            transition: background-color 0.3s ease; pointer-events: auto;
        }
        .navigation label.prev { left: 0; border-radius: 0 50px 50px 0; }
        .navigation label.next { right: 0; border-radius: 50px 0 0 50px; }
        .navigation label:hover { background-color: rgba(119, 157, 119, 1); }
        #slide1:checked ~ .slides { transform: translateX(0%); }
        #slide2:checked ~ .slides { transform: translateX(-16.666%); }
        #slide3:checked ~ .slides { transform: translateX(-33.333%); }
        #slide4:checked ~ .slides { transform: translateX(-50%); }
        #slide5:checked ~ .slides { transform: translateX(-66.666%); }
        #slide6:checked ~ .slides { transform: translateX(-83.333%); }
        #slide1:checked ~ .navigation .next[for="slide2"],
        #slide1:checked ~ .navigation .prev[for="slide6"] { display: block; }
        #slide2:checked ~ .navigation .next[for="slide3"],
        #slide2:checked ~ .navigation .prev[for="slide1"] { display: block; }
        #slide3:checked ~ .navigation .next[for="slide4"],
        #slide3:checked ~ .navigation .prev[for="slide2"] { display: block; }
        #slide4:checked ~ .navigation .next[for="slide5"],
        #slide4:checked ~ .navigation .prev[for="slide3"] { display: block; }
        #slide5:checked ~ .navigation .next[for="slide6"],
        #slide5:checked ~ .navigation .prev[for="slide4"] { display: block; }
        #slide6:checked ~ .navigation .next[for="slide1"],
        #slide6:checked ~ .navigation .prev[for="slide5"] { display: block; }

<script>
    // Função de compra (global)
    function comprar() {
        const versao = document.getElementById('versao').value;
        if (!versao) {
            // Alerta corrigido para Português
            alert("Por favor, selecione uma versão antes de comprar.");
            return;
        }
        gtag('event', 'clique', {
            'event_category': 'compra',
            'event_label': 'compra_historinhas_para_dormir_' + versao
        });
        if (versao === "tradicional") {
            window.location.href = "https://loja.uiclap.com/titulo/ua117232";
        } else if (versao === "premium") {
            window.location.href = "descricaoprod.html";
        }
    }

    // Lógica principal da página (tudo consolidado)
    document.addEventListener('DOMContentLoaded', function() {
        // Player de música de fundo
        const musicPlayerContainer = document.getElementById('music-player-container');
        const playPauseButton = document.getElementById('play-pause-button');
        const backgroundMusic = document.getElementById('background-music');

        playPauseButton.addEventListener('click', function() {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
                musicPlayerContainer.classList.add('playing');
            } else {
                backgroundMusic.pause();
                musicPlayerContainer.classList.remove('playing');
            }
        });

        // Slider automático
        const slideInterval = 3000;
        let autoSlideTimer;
        const sliderContainer = document.querySelector('.slideshow-container');
        const radioButtons = document.querySelectorAll('.slideshow-container input[type="radio"]');

        function startAutoSlider() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(() => {
                const currentRadio = document.querySelector('.slideshow-container input[type="radio"]:checked');
                let currentIndex = Array.from(radioButtons).indexOf(currentRadio);
                let nextIndex = (currentIndex + 1) % radioButtons.length;
                radioButtons[nextIndex].checked = true;
            }, slideInterval);
        }
        
        sliderContainer.addEventListener('click', () => {
             clearInterval(autoSlideTimer);
             setTimeout(startAutoSlider, slideInterval * 2);
        });

        startAutoSlider();
    });
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historinhas para Dormir</title>   
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6L0EHGEC85"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6L0EHGEC85');
    </script>
    
    <style>
        /* --- ESTILOS GERAIS E DE LAYOUT (UNIFICADOS) --- */
        body {
            margin: 0;
			margin-top:0;
            font-family: Arial, sans-serif;
            background-color: #1b2b4b;
            display: flex;
            justify-content: center;
            /* --- CORREÇÃO DE LAYOUT APLICADA AQUI --- */
            align-items: flex-start; /* Alinha o conteúdo no topo */
            min-height: 100vh;
            padding: 0px 0; /* Adiciona um respiro vertical na página */
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            max-width: 420px;
            width: 100%;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.3);
            text-align: center;
        }
        .header-img {
            width: 100%;
            display: block;
        }
        
        /* --- PLAYER DE MÚSICA DE FUNDO --- */
        #music-player-container {
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 5px 12px;
            border-radius: 50px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        #play-pause-button {
            background: #7a9cff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            padding: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            margin-right: 8px;
        }
        #play-pause-button svg {
            fill: white;
            width: 15px;
            height: 15px;
        }
        #music-player-container .pause-icon { display: none; }
        #music-player-container.playing .music-icon { display: none; }
        #music-player-container.playing .pause-icon { display: block; }
        #music-title {
            font-size: 0.8em;
            color: #333;
            font-weight: 500;
        }
        
        /* --- SLIDER DE IMAGENS --- */
        .slideshow-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            aspect-ratio: 4 / 3;
        }
        .slides {
            display: flex;
            width: 500%;
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }
        .slide {
            width: 20%;
            height: 100%;
        }
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .slideshow-container input { display: none; }
        .navigation {
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .navigation label {
            display: none;
            cursor: pointer;
            position: absolute;
            top: 0;
            padding: 15px;
            background-color: rgba(122, 156, 255, 0.7);
            color: white;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            transition: background-color 0.3s ease;
            pointer-events: auto;
        }
        .navigation label.prev { left: 0; border-radius: 0 50px 50px 0; }
        .navigation label.next { right: 0; border-radius: 50px 0 0 50px; }
        .navigation label:hover { background-color: rgba(90, 125, 255, 1); }
        #slide1:checked ~ .slides { transform: translateX(0%); }
        #slide2:checked ~ .slides { transform: translateX(-20%); }
        #slide3:checked ~ .slides { transform: translateX(-40%); }
        #slide4:checked ~ .slides { transform: translateX(-60%); }
        #slide5:checked ~ .slides { transform: translateX(-80%); }
        #slide1:checked ~ .navigation label.next[for="slide2"],
        #slide1:checked ~ .navigation label.prev[for="slide5"] { display: block; }
        #slide2:checked ~ .navigation label.next[for="slide3"],
        #slide2:checked ~ .navigation label.prev[for="slide1"] { display: block; }
        #slide3:checked ~ .navigation label.next[for="slide4"],
        #slide3:checked ~ .navigation label.prev[for="slide2"] { display: block; }
        #slide4:checked ~ .navigation label.next[for="slide5"],
        #slide4:checked ~ .navigation label.prev[for="slide3"] { display: block; }
        #slide5:checked ~ .navigation label.next[for="slide1"],
        #slide5:checked ~ .navigation label.prev[for="slide4"] { display: block; }

        /* --- SELEÇÃO E BOTÃO DE COMPRA --- */
        .select-container {
            margin: 20px auto;
            width: 90%;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }
        .buy-btn {
            background-color: #00a3d9;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            width: 90%;
            margin-bottom: 20px;
        }
        .buy-btn:hover {
            background-color: #008bb8;
        }

        /* --- RODAPÉ --- */
        .footer-table {
            width: 100%;
            background-color: #002f5b;
            border-spacing: 0;
            padding: 15px 0;
        }
        .footer-table td {
            text-align: center;
            padding: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="LandpageHistorinha.jpg" alt="Historinhas para Dormir" class="header-img">

    <video controls width="100%" poster="postervideo.jpg" style="display:block;">
        <source src="historinhas.mp4" type="video/mp4">
    </video>
    <br>

    <div class="slideshow-container">
        <input type="radio" name="slider" id="slide1" checked>
        <input type="radio" name="slider" id="slide2">
        <input type="radio" name="slider" id="slide3">
        <input type="radio" name="slider" id="slide4">
        <input type="radio" name="slider" id="slide5">
        <div class="slides">
            <div class="slide"><img src="livrohistorinhasparadormir1.jpg" alt="Página do livro 1"></div>
            <div class="slide"><img src="livrohistorinhasparadormir2.jpg" alt="Página do livro 2"></div>
            <div class="slide"><img src="livrohistorinhasparadormir3.jpg" alt="Página do livro 3"></div>
            <div class="slide"><img src="livrohistorinhasparadormir4.jpg" alt="Página do livro 4"></div>
            <div class="slide"><img src="livrohistorinhasparadormir5.jpg" alt="Página do livro 5"></div>
        </div>
        <div class="navigation">
            <label for="slide5" class="prev">&#10094;</label> 
            <label for="slide1" class="prev">&#10094;</label> 
            <label for="slide2" class="prev">&#10094;</label> 
            <label for="slide3" class="prev">&#10094;</label> 
            <label for="slide4" class="prev">&#10094;</label> 
            <label for="slide2" class="next">&#10095;</label> 
            <label for="slide3" class="next">&#10095;</label> 
            <label for="slide4" class="next">&#10095;</label> 
            <label for="slide5" class="next">&#10095;</label> 
            <label for="slide1" class="next">&#10095;</label> 
        </div>
    </div>
    <br>    
<iframe src="../depoimentos/depoimentos.html" width="100%" height="450px" scrolling="no" frameborder="0"></iframe>
    <div class="select-container">
        <select id="versao">
            <option value="" disabled selected>Selecionar versão</option>
            <option value="tradicional">Tradicional - 49,99</option>
            <option value="premium">Premium - 59,99</option>
        </select>
    </div>

    <button class="buy-btn" onclick="comprar()">SAIBA MAIS</button>
    <br><br>

    <div id="music-player-container">
        <audio id="background-music" src="cancaoninar.mp3" loop></audio>
        <button id="play-pause-button" title="Tocar música">
            <svg class="music-icon" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="#FFFFFF"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <svg class="pause-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="24px" height="24px"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <span id="music-title">Tocar</span>
    </div>

    <table class="footer-table" width="100%" border="0" cellpadding="0">
        <tr>
            <td colspan="4"><img src="pagamentos.jpg" width="100%" height="auto" alt="Formas de pagamento"></td>
        </tr>
        <tr>
            <td><a href="https://www.instagram.com/adamo.felipe/" target="blank"><img src="livrinhoparacolorir_03.jpg" width="50" height="auto" alt="Instagram"></a></td>
            <td><a href="https://wa.me/5519991950005" target="blank"><img src="livrinhoparacolorir_05.jpg" width="50" height="auto" alt="Whatsapp"></a></td>
            <td><a href="https://www.kwai.com/adamo.felpe/" target="blank"><img src="livrinhoparacolorir_09.jpg" width="50" height="auto" alt="Kwai"></a></td>
            <td><a href="https://www.tiktok.com/adamofelipe/" target="blank"><img src="livrinhoparacolorir_07.jpg" width="50" height="auto" alt="TikTok"></a></td>
        </tr>
        <tr>
            <td colspan="4"><img src="direitos.jpg" width="70%" height="auto" alt="Direitos Reservados"></td>
        </tr>
    </table>
</div>

<script>
    // Função de compra (global)
    function comprar() {
        const versao = document.getElementById('versao').value;
        if (!versao) {
            alert("Por favor, selecione uma versão antes de comprar.");
            return;
        }
        gtag('event', 'clique', {
            'event_category': 'compra',
            'event_label': 'compra_historinhas_para_dormir_' + versao
        });
        if (versao === "tradicional") {
            window.location.href = "https://loja.uiclap.com/titulo/ua111036";
        } else if (versao === "premium") {
            window.location.href = "descricaoprod.html";
        }
    }

    // Lógica principal da página (tudo consolidado)
    document.addEventListener('DOMContentLoaded', function() {
        // Slider automático
        const slideInterval = 3000;
        let autoSlideTimer;
        function startAutoSlider() {
            clearInterval(autoSlideTimer);
            autoSlideTimer = setInterval(() => {
                const currentRadio = document.querySelector('.slideshow-container input[type="radio"]:checked');
                let nextRadio = currentRadio.nextElementSibling;
                while(nextRadio && nextRadio.nodeName !== 'INPUT') {
                    nextRadio = nextRadio.nextElementSibling;
                }
                if (!nextRadio) {
                    nextRadio = document.querySelector('.slideshow-container input[type="radio"]');
                }
                nextRadio.checked = true;
            }, slideInterval);
        }
        const sliderContainer = document.querySelector('.slideshow-container');
        sliderContainer.addEventListener('click', startAutoSlider);
        startAutoSlider();

        // Player de música de fundo
        const musicPlayerContainer = document.getElementById('music-player-container');
        const playPauseButton = document.getElementById('play-pause-button');
        const backgroundMusic = document.getElementById('background-music');
        playPauseButton.addEventListener('click', function() {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
                musicPlayerContainer.classList.add('playing');
            } else {
                backgroundMusic.pause();
                musicPlayerContainer.classList.remove('playing');
            }
        });
    });
</script>
</body>
</html>

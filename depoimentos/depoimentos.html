<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depoimentos</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .carousel {
      position: relative;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .carousel-inner {
      display: flex;
      transition: transform 0.6s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      padding: 30px 20px;
      text-align: center;
    }

    .testimonial {
      font-size: 18px;
      font-style: italic;
      color: #444;
      margin-bottom: 15px;
    }

    .author {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
      color: #222;
    }

    .stars {
      color: #f5c518;
      font-size: 20px;
      margin: 8px 0;
    }

    .media-thumbnail {
      max-width: 90%;
      max-height: 280px;
      border-radius: 10px;
      margin-top: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      object-fit: cover;
    }

    video.media-thumbnail {
      background: #000;
    }

    .carousel-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 15px;
    }

    .control-btn {
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 18px;
      transition: background 0.3s;
    }

    .control-btn:hover {
      background: rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <h1>Depoimentos dos Clientes</h1>
  <div class="carousel" id="testimonialCarousel">
    <div class="carousel-inner" id="carouselInner"></div>
    <div class="carousel-controls">
      <button class="control-btn" id="prevBtn">&#8592;</button>
      <button class="control-btn" id="nextBtn">&#8594;</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOcyN-syf8c4SehWK83ZX_OhBHZ5DNGoE",
      authDomain: "meus-depoimentos.firebaseapp.com",
      projectId: "meus-depoimentos",
      storageBucket: "meus-depoimentos.appspot.com",
      messagingSenderId: "781528550069",
      appId: "1:781528550069:web:7ce3ac3253a2d7c3ac4cfc",
      measurementId: "G-90MR5JQT0Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const carouselInner = document.getElementById("carouselInner");
    let currentIndex = 0;
    let totalItems = 0;

    async function loadTestimonials() {
      const q = query(collection(db, "depoimentos"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        carouselInner.innerHTML = "<p style='text-align:center;'>Nenhum depoimento disponível ainda.</p>";
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        let mediaHTML = '';
        if (data.media && data.media.length > 0) {
          const mediaUrls = data.media.split(',');
          mediaUrls.forEach(url => {
            const isVideo = ['.mp4', '.mov', '.webm'].some(ext => url.toLowerCase().includes(ext));
            mediaHTML += isVideo 
              ? `<video src="${url}nth/0/" class="media-thumbnail" controls></video>`
              : `<img src="${url}nth/0/" alt="Mídia do depoimento" class="media-thumbnail">`;
          });
        }

        const stars = "★".repeat(data.rating || 0);

        const slide = `
          <div class="carousel-item">
            <p class="testimonial">"${data.testimonial}"</p>
            <p class="stars">${stars}</p>
            <p class="author">- ${data.name} (${data.role})</p>
            ${mediaHTML}
          </div>
        `;
        carouselInner.innerHTML += slide;
      });

      totalItems = document.querySelectorAll(".carousel-item").length;
    }

    loadTestimonials();

    function showSlide(index) {
      carouselInner.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % totalItems;
      showSlide(currentIndex);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalItems) % totalItems;
      showSlide(currentIndex);
    });

    // autoplay a cada 5 segundos
    setInterval(() => {
      if (totalItems > 0) {
        currentIndex = (currentIndex + 1) % totalItems;
        showSlide(currentIndex);
      }
    }, 5000);
  </script>
</body>
</html>

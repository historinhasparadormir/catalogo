<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depoimentos - Historinhas para Dormir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS do Swiper.js para o Carrossel -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.css" rel="stylesheet">

    <style>
        :root {
            --cor-primaria: #a2d2ff;
            --cor-secundaria: #ffafcc;
            --cor-texto: #555;
            --fonte-principal: 'Nunito', sans-serif;
        }
        body {
            font-family: var(--fonte-principal);
            background-color: #fdf4f5;
            background-image: url('https://www.transparenttextures.com/patterns/light-paper-fibers.png');
            margin: 0;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; font-weight: 800; color: var(--cor-primaria); margin: 0; }
        .header p { font-size: 1.1rem; color: var(--cor-texto); }

        /* --- INÍCIO DA ALTERAÇÃO: ESTILOS DO CARROSSEL --- */
        .swiper {
            width: 100%;
            max-width: 500px; /* Largura máxima do carrossel */
            padding-top: 20px;
            padding-bottom: 50px; /* Espaço para a paginação */
        }
        .swiper-slide {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-height: 350px; /* Altura mínima para consistência */
        }
        /* --- FIM DA ALTERAÇÃO: ESTILOS DO CARROSSEL --- */

        /* --- INÍCIO DA ALTERAÇÃO: TAG DO PRODUTO COM IMAGEM --- */
        .product-tag {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: #eaf4ff;
            border-radius: 50px;
            padding: 5px;
            padding-right: 15px;
            align-self: flex-start;
        }
        .product-tag img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }
        .product-tag span {
            color: #005a9c;
            font-size: 0.8rem;
            font-weight: 700;
        }
        /* --- FIM DA ALTERAÇÃO --- */
        
        .author-info { font-weight: 800; text-align: left; }
        .author-name { font-size: 1.2rem; color: #333; }
        .author-role { font-size: 1rem; color: var(--cor-secundaria); }
        .testimonial-text {
            font-size: 1rem; color: var(--cor-texto); line-height: 1.6; font-style: italic;
            border-left: 4px solid var(--cor-primaria); padding-left: 15px; text-align: left;
        }
        .star-rating { color: #ffdd57; font-size: 1.2rem; text-align: left; }
        .media-gallery { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 15px; }
        .media-thumbnail {
            width: 60px; height: 60px; border-radius: 10px;
            object-fit: cover; cursor: pointer; transition: transform 0.2s;
        }
        .media-thumbnail:hover { transform: scale(1.1); }
        #loading-state { text-align: center; font-size: 1.2rem; color: var(--cor-texto); }
        .swiper-pagination-bullet-active {
            background-color: var(--cor-primaria);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Mundo Mágico de Depoimentos</h1>
        <p>Veja o que as famílias estão dizendo!</p>
    </div>

    <!-- INÍCIO DA ALTERAÇÃO: ESTRUTURA DO CARROSSEL -->
    <div id="testimonials-container" class="swiper">
        <div class="swiper-wrapper">
            <!-- Slides dos depoimentos serão inseridos aqui -->
        </div>
        <!-- Adiciona bolinhas de paginação -->
        <div class="swiper-pagination"></div>
    </div>
    <!-- FIM DA ALTERAÇÃO -->
    <p id="loading-state">Carregando depoimentos...</p>

    <script src="https://cdn.jsdelivr.net/npm/basiclightbox@5.0.4/dist/basicLightbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // ==========================================================================================
        //  INÍCIO DA ÁREA DE CONFIGURAÇÃO - ALTERE APENAS AQUI!
        // ==========================================================================================

        // PASSO 1: DEFINA O NOME EXATO DO PRODUTO PARA ESTA PÁGINA
        // O nome deve ser IDÊNTICO ao que está no formulário.
        const PRODUCT_NAME_TO_FILTER = "Livrinho 32 Historinhas para Dormir";

        // PASSO 2: MAPA DE IMAGENS DOS PRODUTOS
        // Adicione a URL da imagem para cada produto.
        const productImages = {
            "Livrinho 32 Historinhas para Dormir": "https://historinhasparadormir.github.io/catalogo/livrohistorinhasparadormir1.jpg",
            "32 Contos de Fadas Infantil": "https://historinhasparadormir.github.io/catalogo/modelos/modeloslivrinhocolorir1.jpg",
            "Livrinho para Colorir Mundo Fofinho": "URL_DA_IMAGEM_DO_LIVRINHO_DE_COLORIR.jpg"
            // Adicione mais produtos aqui no futuro
        };

        // PASSO 3: COLE A CONFIGURAÇÃO DO SEU FIREBASE AQUI
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };
        // ==========================================================================================
        // FIM DA ÁREA DE CONFIGURAÇÃO - NÃO ALTERE O CÓDIGO ABAIXO
        // ==========================================================================================
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const wrapper = document.querySelector('.swiper-wrapper');
        const loadingState = document.getElementById('loading-state');

        async function fetchTestimonials() {
            try {
                // Query para filtrar pelo nome do produto
                const testimonialsCol = collection(db, "depoimentos");
                const q = query(testimonialsCol, where("productName", "==", PRODUCT_NAME_TO_FILTER), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                loadingState.style.display = 'none';
                
                if (querySnapshot.empty) {
                    wrapper.innerHTML = `<div class="swiper-slide"><p style="text-align:center; width:100%;">Ainda não há depoimentos para este produto. Seja o primeiro!</p></div>`;
                } else {
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        let starsHTML = Array(5).fill('☆').map((_, i) => i < data.rating ? '★' : '☆').join('');
                        let productImgSrc = productImages[data.productName] || 'https://placehold.co/100x100/EEE/31343C?text=?';

                        let mediaHTML = '';
                        if (data.media && data.media.length > 0) {
                            data.media.forEach(url => {
                                const isVideo = ['.mp4', '.mov', '.webm'].some(ext => url.toLowerCase().includes(ext));
                                mediaHTML += isVideo 
                                    ? `<video src="${url}" class="media-thumbnail"></video>`
                                    : `<img src="${url}" alt="Mídia do depoimento" class="media-thumbnail">`;
                            });
                        }
                        
                        const slide = document.createElement('div');
                        slide.className = 'swiper-slide';
                        slide.innerHTML = `
                            <div class="product-tag">
                                <img src="${productImgSrc}" alt="Foto do produto ${data.productName}">
                                <span>${data.productName}</span>
                            </div>
                            <div class="author-info">
                                <div class="author-name">${data.name}</div>
                                <div class="author-role">${data.role} do(a) ${data.childName}</div>
                            </div>
                            <div class="star-rating">${starsHTML}</div>
                            <p class="testimonial-text">"${data.testimonial}"</p>
                            <div class="media-gallery">${mediaHTML}</div>
                        `;
                        wrapper.appendChild(slide);
                    });
                }

                // INÍCIO DA ALTERAÇÃO: INICIALIZA O CARROSSEL
                new Swiper('.swiper', {
                    loop: true,
                    autoplay: {
                        delay: 5000, // 5 segundos
                        disableOnInteraction: false,
                    },
                    pagination: {
                        el: '.swiper-pagination',
                        clickable: true,
                    },
                    grabCursor: true,
                });
                // FIM DA ALTERAÇÃO

                // Re-adiciona a funcionalidade de lightbox após criar os slides
                wrapper.querySelectorAll('.media-thumbnail').forEach(thumb => {
                    thumb.addEventListener('click', () => {
                        const content = thumb.tagName === 'IMG'
                            ? `<img src="${thumb.src}">`
                            : `<video src="${thumb.src}" controls autoplay></video>`;
                        basicLightbox.create(content).show();
                    });
                });

            } catch (error) {
                console.error("Erro ao buscar depoimentos: ", error);
                loadingState.textContent = "Não foi possível carregar os depoimentos.";
            }
        }
        
        fetchTestimonials();
    </script>
</body>
</html>

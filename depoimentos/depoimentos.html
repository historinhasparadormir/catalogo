<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Depoimentos</title>

  <!-- Fonte Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --cor-primaria: #a2d2ff; /* Azul bebê */
      --cor-secundaria: #ffafcc; /* Rosa suave */
      --cor-texto: #5c5c7b;
      --cor-estrelas: #ffdd57;
      --fonte-principal: 'Nunito', sans-serif;
    }

    body {
      font-family: var(--fonte-principal);
      background-color: #f8f9fe;
      background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
      margin: 0;
      padding: 30px 15px;
      color: var(--cor-texto);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--cor-primaria);
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    .carousel {
      position: relative;
      max-width: 550px;
      margin: 0 auto;
      overflow: hidden;
    }

    .carousel-inner {
      display: flex;
      transition: transform 0.5s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      padding: 20px;
    }

    .testimonial-card {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(150, 170, 200, 0.2);
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .testimonial-card::before {
      content: '“';
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 6rem;
      font-weight: 800;
      color: rgba(162, 210, 255, 0.2);
      z-index: 1;
    }

    .testimonial-content {
      position: relative;
      z-index: 2;
    }

    .testimonial {
      font-size: 1.1rem;
      font-style: italic;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .stars {
      color: var(--cor-estrelas);
      font-size: 1.3rem;
      margin-bottom: 15px;
    }

    .author {
      font-weight: 700;
      margin-top: 15px;
      line-height: 1.4;
    }
    .author-name {
      font-size: 1.1rem;
      color: #333;
      font-weight: 800;
    }
    .author-role {
      font-size: 0.95rem;
      color: var(--cor-secundaria);
    }

    .media-thumbs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #f0f0f0;
    }

    .media-thumbnail {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid #eee;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .media-thumbnail:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(162, 210, 255, 0.5);
    }

    .carousel-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0;
      pointer-events: none;
      z-index: 10;
    }

    .control-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.8);
      color: var(--cor-primaria);
      border: none;
      width: 45px;
      height: 45px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 24px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .control-btn:hover {
      background: var(--cor-primaria);
      color: white;
    }

    #prevBtn { margin-left: -22px; }
    #nextBtn { margin-right: -22px; }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .modal-inner {
      position: relative;
      max-width: 380px;
      width: 90%;
    }

    .modal-inner img, .modal-inner video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    .modal-close, .modal-prev, .modal-next {
      position: absolute;
      color: white;
      font-size: 2rem;
      background: rgba(0,0,0,0.3);
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .modal-close:hover, .modal-prev:hover, .modal-next:hover {
      background: rgba(0,0,0,0.6);
    }

    .modal-close { top: -50px; right: 0; }
    .modal-prev { left: -60px; top: 50%; transform: translateY(-50%); }
    .modal-next { right: -60px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .modal-prev { left: 10px; transform: translateY(-50%); }
      .modal-next { right: 10px; transform: translateY(-50%); }
    }
  </style>
</head>
<body>
  <h1>Depoimentos dos Clientes</h1>

  <div class="carousel" id="testimonialCarousel" aria-label="carrossel de depoimentos">
    <div class="carousel-inner" id="carouselInner"></div>

    <div class="carousel-controls" aria-hidden="false">
      <button class="control-btn" id="prevBtn" aria-label="Anterior">&#10094;</button>
      <button class="control-btn" id="nextBtn" aria-label="Próximo">&#10095;</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="mediaModal" class="modal" aria-hidden="true">
    <div class="modal-inner" id="modalInner"></div>
    <div class="modal-close" id="closeModal" title="Fechar">&times;</div>
    <div class="modal-prev" id="prevMedia" title="Anterior">&#10094;</div>
    <div class="modal-next" id="nextMedia" title="Próximo">&#10095;</div>
  </div>

  <!-- Seu script original continua igual -->
  <script type="module">
    // ... aqui vai exatamente o mesmo JS do seu primeiro código
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil Infantil</title>
  <style>
    body {
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      background: linear-gradient(to bottom, #fef6ff, #fcefff);
      color: #444;
      margin: 0;
      padding: 0;
    }

    .profile-container {
      max-width: 650px;
      margin: 40px auto;
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .profile-header h1 {
      font-size: 22px;
      margin: 0;
      color: #5a3d9a;
      font-weight: bold;
    }

    .profile-header h2 {
      font-size: 18px;
      margin: 5px 0 0;
      color: #f28a2e;
      font-weight: normal;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      cursor: pointer;
      transition: transform 0.2s;
      border: 3px solid #f8e6ff;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      padding-top: 50px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
    }

    .modal-content {
      margin: auto;
      display: block;
      max-width: 380px;
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .close, .prev, .next {
      position: absolute;
      top: 50%;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      padding: 12px;
      user-select: none;
      border-radius: 50%;
      background: rgba(0,0,0,0.4);
      transform: translateY(-50%);
    }

    .close {
      top: 30px;
      right: 30px;
      transform: none;
    }

    .prev {
      left: 20px;
    }

    .next {
      right: 20px;
    }

    .close:hover, .prev:hover, .next:hover {
      background: rgba(0,0,0,0.7);
    }

    /* Animação */
    @keyframes zoom {
      from {transform: scale(0.7);}
      to {transform: scale(1);}
    }

    .modal-content {
      animation: zoom 0.3s;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <h1>Adamo Costa - Pai da Gabi</h1>
      <h2>Gabriela</h2>
    </div>

    <div class="gallery">
      <img src="foto1.jpg" alt="Foto 1" onclick="openModal(0)">
      <img src="foto2.jpg" alt="Foto 2" onclick="openModal(1)">
      <img src="foto3.jpg" alt="Foto 3" onclick="openModal(2)">
    </div>
  </div>

  <!-- Modal -->
  <div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <span class="prev" onclick="changeSlide(-1)">&#10094;</span>
    <span class="next" onclick="changeSlide(1)">&#10095;</span>
    <img class="modal-content" id="modalImg">
  </div>

  <script>
    let currentIndex = 0;
    const images = document.querySelectorAll('.gallery img');
    const modal = document.getElementById("myModal");
    const modalImg = document.getElementById("modalImg");

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "block";
      modalImg.src = images[currentIndex].src;
    }

    function closeModal() {
      modal.style.display = "none";
    }

    function changeSlide(n) {
      currentIndex += n;
      if (currentIndex < 0) currentIndex = images.length - 1;
      if (currentIndex >= images.length) currentIndex = 0;
      modalImg.src = images[currentIndex].src;
    }

    // Fechar clicando fora da imagem
    window.onclick = function(event) {
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depoimentos</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      margin: 0;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
    }

    .carousel {
      position: relative;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .carousel-inner {
      display: flex;
      transition: transform 0.6s ease-in-out;
    }

    .carousel-item {
      min-width: 100%;
      box-sizing: border-box;
      padding: 30px 20px;
      text-align: center;
    }

    .testimonial {
      font-size: 18px;
      font-style: italic;
      color: #444;
      margin-bottom: 15px;
    }

    .author {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
      color: #222;
    }

    .stars {
      color: #f5c518;
      font-size: 20px;
      margin: 8px 0;
    }

    .media-thumbnail {
      max-width: 100px;
      max-height: 100px;
      border-radius: 8px;
      margin: 5px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      object-fit: cover;
      cursor: pointer;
    }

    video.media-thumbnail {
      background: #000;
    }

    .carousel-controls {
      position: absolute;
      top: 50%;
      width: 100%;
      display: flex;
      justify-content: space-between;
      transform: translateY(-50%);
      padding: 0 15px;
    }

    .control-btn {
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      padding: 12px;
      cursor: pointer;
      border-radius: 50%;
      font-size: 18px;
      transition: background 0.3s;
    }

    .control-btn:hover {
      background: rgba(0,0,0,0.8);
    }

    /* Modal popup */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      padding-top: 50px;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 90%;
      max-height: 80%;
    }

    .modal-content img, 
    .modal-content video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
    }

    .close, .prev, .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
      background: rgba(0,0,0,0.4);
      border-radius: 50%;
    }

    .close {
      top: 10%;
      right: 5%;
      transform: none;
    }

    .prev { left: 5%; }
    .next { right: 5%; }
  </style>
</head>
<body>
  <h1>Depoimentos dos Clientes</h1>
  <div class="carousel" id="testimonialCarousel">
    <div class="carousel-inner" id="carouselInner"></div>
    <div class="carousel-controls">
      <button class="control-btn" id="prevBtn">&#8592;</button>
      <button class="control-btn" id="nextBtn">&#8594;</button>
    </div>
  </div>

  <!-- Modal -->
  <div id="mediaModal" class="modal">
    <span class="close" id="closeModal">&times;</span>
    <span class="prev" id="prevMedia">&#10094;</span>
    <div class="modal-content" id="modalContent"></div>
    <span class="next" id="nextMedia">&#10095;</span>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOcyN-syf8c4SehWK83ZX_OhBHZ5DNGoE",
      authDomain: "meus-depoimentos.firebaseapp.com",
      projectId: "meus-depoimentos",
      storageBucket: "meus-depoimentos.appspot.com",
      messagingSenderId: "781528550069",
      appId: "1:781528550069:web:7ce3ac3253a2d7c3ac4cfc",
      measurementId: "G-90MR5JQT0Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const carouselInner = document.getElementById("carouselInner");
    const modal = document.getElementById("mediaModal");
    const modalContent = document.getElementById("modalContent");
    let currentIndex = 0;
    let totalItems = 0;
    let mediaList = [];
    let currentMediaIndex = 0;

    async function loadTestimonials() {
      const q = query(collection(db, "depoimentos"), orderBy("createdAt", "desc"));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        carouselInner.innerHTML = "<p style='text-align:center;'>Nenhum depoimento disponível ainda.</p>";
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();

        let mediaHTML = '';
        if (data.media && data.media.length > 0) {
          const mediaUrls = data.media.split(',');
          mediaUrls.forEach(url => {
            const isVideo = ['.mp4', '.mov', '.webm'].some(ext => url.toLowerCase().includes(ext));
            mediaHTML += isVideo 
              ? `<video src="${url.trim()}nth/0/" class="media-thumbnail" data-url="${url.trim()}" muted></video>`
              : `<img src="${url.trim()}nth/0/" alt="Mídia do depoimento" class="media-thumbnail" data-url="${url.trim()}">`;
          });
        }

        const stars = "★".repeat(data.rating || 0);

        const slide = `
          <div class="carousel-item">
            <p class="testimonial">"${data.testimonial}"</p>
            <p class="stars">${stars}</p>
            <p class="author">${data.name} (${data.role}) da ${data.childName}</p>
            <div class="media-container">${mediaHTML}</div>
          </div>
        `;
        carouselInner.innerHTML += slide;
      });

      totalItems = document.querySelectorAll(".carousel-item").length;

      // evento de abrir popup ao clicar
      document.querySelectorAll(".media-thumbnail").forEach((thumb, index) => {
        thumb.addEventListener("click", () => openModal(index));
        mediaList.push({ url: thumb.dataset.url, isVideo: thumb.tagName === "VIDEO" });
      });
    }

    loadTestimonials();

    function showSlide(index) {
      carouselInner.style.transform = `translateX(-${index * 100}%)`;
    }

    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % totalItems;
      showSlide(currentIndex);
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + totalItems) % totalItems;
      showSlide(currentIndex);
    });

    // autoplay
    setInterval(() => {
      if (totalItems > 0) {
        currentIndex = (currentIndex + 1) % totalItems;
        showSlide(currentIndex);
      }
    }, 5000);

    // modal
    function openModal(index) {
      currentMediaIndex = index;
      showMedia(index);
      modal.style.display = "block";
    }

    function showMedia(index) {
      modalContent.innerHTML = "";
      const media = mediaList[index];
      if (media.isVideo) {
        modalContent.innerHTML = `<video src="${media.url}" controls autoplay></video>`;
      } else {
        modalContent.innerHTML = `<img src="${media.url}" alt="mídia">`;
      }
    }

    document.getElementById("closeModal").addEventListener("click", () => {
      modal.style.display = "none";
    });

    document.getElementById("nextMedia").addEventListener("click", () => {
      currentMediaIndex = (currentMediaIndex + 1) % mediaList.length;
      showMedia(currentMediaIndex);
    });

    document.getElementById("prevMedia").addEventListener("click", () => {
      currentMediaIndex = (currentMediaIndex - 1 + mediaList.length) % mediaList.length;
      showMedia(currentMediaIndex);
    });

    window.addEventListener("click", (e) => {
      if (e.target == modal) modal.style.display = "none";
    });
  </script>
</body>
</html>

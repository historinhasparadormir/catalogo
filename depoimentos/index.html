<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deixe seu Depoimento - Historinhas para Dormir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
            <style>
  :root {
    --cor-primaria: #a2d2ff; /* Azul bebê */
    --cor-secundaria: #ffafcc; /* Rosa suave */
    --cor-texto: #5c5c7b;
    --cor-estrelas: #ffdd57;
    --fonte-principal: 'Nunito', sans-serif;
  }

  body {
    font-family: var(--fonte-principal);
    background-color: #f8f9fe;
    background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    margin: 0;
    padding: 30px 15px;
    color: var(--cor-texto);
  }

  h1 {
    text-align: center;
    margin-bottom: 30px;
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--cor-primaria);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
  }

  .carousel {
    position: relative;
    max-width: 600px;
    margin: 0 auto;
    overflow: hidden;
  }

  .carousel-inner {
    display: flex;
    transition: transform 0.5s ease-in-out;
  }

  .carousel-item {
    min-width: 100%;
    box-sizing: border-box;
    padding: 20px;
  }

  /* Card para cada depoimento */
  .carousel-item p.testimonial {
    font-size: 1.1rem;
    font-style: italic;
    line-height: 1.6;
    background: #fff;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 15px;
    box-shadow: 0 8px 25px rgba(150, 170, 200, 0.2);
  }

  .stars {
    color: var(--cor-estrelas);
    font-size: 1.3rem;
    margin-bottom: 10px;
    text-align: center;
  }

  .author {
    font-weight: 700;
    margin-top: 10px;
    line-height: 1.4;
    text-align: center;
  }

  /* Agora divide em duas linhas */
  .author-line1 {
    font-size: 1.05rem;
    font-weight: 800;
    color: #333;
  }
  .author-line2 {
    font-size: 0.95rem;
    color: var(--cor-secundaria);
  }

  /* Miniaturas */
  .media-thumbnail {
    width: 70px;
    height: 70px;
    border-radius: 12px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid #eee;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    margin: 5px;
  }
  .media-thumbnail:hover {
    transform: scale(1.1);
    box-shadow: 0 5px 15px rgba(162, 210, 255, 0.5);
  }

  /* Botões carrossel */
  .carousel-controls {
    position: absolute;
    top: 50%;
    width: 100%;
    display: flex;
    justify-content: space-between;
    transform: translateY(-50%);
    padding: 0;
    pointer-events: none;
    z-index: 10;
  }

  .control-btn {
    pointer-events: auto;
    background: rgba(255, 255, 255, 0.9);
    color: var(--cor-primaria);
    border: none;
    width: 45px;
    height: 45px;
    cursor: pointer;
    border-radius: 50%;
    font-size: 24px;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .control-btn:hover {
    background: var(--cor-primaria);
    color: white;
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
  }

  .modal-content {
    max-width: 380px;
    width: 90%;
  }

  .modal-content img, .modal-content video {
    width: 100%;
    height: auto;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .close, .prev, .next {
    position: absolute;
    color: white;
    font-size: 2rem;
    background: rgba(0,0,0,0.3);
    border-radius: 50%;
    width: 45px;
    height: 45px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.2s;
  }

  .close { top: 20px; right: 20px; }
  .prev { left: 20px; top: 50%; transform: translateY(-50%); }
  .next { right: 20px; top: 50%; transform: translateY(-50%); }
</style>
</head>
<body>
    <div class="form-container">
        <div id="preloader">
            <div class="moon"></div>
            <p id="preloader-text">Enviando seu depoimento...</p>
            <div id="error-feedback">
                <h2>Oops! Algo deu errado.</h2>
                <p>Não foi possível salvar seu depoimento. Por favor, tente novamente.</p>
                <button id="retry-btn" class="retry-btn">Tentar Novamente</button>
            </div>
        </div>

        <form id="testimonialForm">
            <h1>Conte sua História! ✨</h1>
            <div class="form-group">
                <label for="name">Seu nome completo:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="role">Você é o pai ou a mãe?</label>
                <select id="role" required> <option value="Pai">Pai</option> <option value="Mãe">Mãe</option> </select>
            </div>
            <div class="form-group">
                <label for="childName">Nome do(a) seu(sua) filho(a):</label>
                <input type="text" id="childName" required>
            </div>
            <div class="form-group">
                <label for="product">Qual produto você comprou?</label>
                <select id="product" required>
                    <option value="" disabled selected>Escolha um produto...</option>
                    <option value="Livrinho 32 Historinhas para Dormir">Livrinho 32 Historinhas para Dormir</option>
                    <option value="32 Contos de Fadas Infantil">32 Contos de Fadas Infantil</option>
                    <option value="Livrinho para Colorir Mundo Fofinho">Livrinho para Colorir Mundo Fofinho</option>
                </select>
            </div>
            <div class="form-group">
                <label for="testimonial">Seu depoimento (máx. 200 caracteres):</label>
                <textarea id="testimonial" maxlength="200" required></textarea>
            </div>
            <div class="form-group">
                <label>Sua nota:</label>
                <div class="star-rating">
                    <span class="star" data-value="1">★</span> <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span> <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <input type="hidden" id="rating">
            </div>
            <div class="form-group">
                <label>Envie uma foto ou vídeo (opcional):</label>
                <input type="hidden" role="uploadcare-uploader" data-multiple="true" data-multiple-max="5" data-image-shrink="1920x1920 80%" />
            </div>
            <button type="submit" class="submit-btn">Enviar Depoimento</button>
        </form>
        <div id="success-message">
            <h2>Obrigado! ✨</h2>
            <p>Seu depoimento foi enviado com sucesso e logo aparecerá na nossa página!</p>
            <a href="depoimentos.html" class="view-testimonials-btn">Ver todos os depoimentos</a>
        </div>
    </div>

    <script>
        UPLOADCARE_PUBLIC_KEY = 'a45c2febeabd4d38ab78';
    </script>
    <script charset="utf-8" src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAOcyN-syf8c4SehWK83ZX_OhBHZ5DNGoE",
        authDomain: "meus-depoimentos.firebaseapp.com",
        projectId: "meus-depoimentos",
        storageBucket: "meus-depoimentos.appspot.com",
        messagingSenderId: "781528550069",
        appId: "1:781528550069:web:7ce3ac3253a2d7c3ac4cfc",
        measurementId: "G-90MR5JQT0Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');
    stars.forEach(star => {
        star.addEventListener('click', () => {
            ratingInput.value = star.dataset.value;
            stars.forEach(s => s.classList.toggle('selected', s.dataset.value <= ratingInput.value));
        });
    });

    const form = document.getElementById('testimonialForm');
    const successMessage = document.getElementById('success-message');
    const widget = uploadcare.Widget('[role=uploadcare-uploader]');
    const submitBtn = form.querySelector('.submit-btn');
    const preloader = document.getElementById('preloader');
    const preloaderText = document.getElementById('preloader-text');
    const errorFeedback = document.getElementById('error-feedback');
    const retryBtn = document.getElementById('retry-btn');
    const moonAnimation = preloader.querySelector('.moon');
    
    widget.onChange(group => {
        if (group) {
            group.progress(info => {
                preloaderText.textContent = `Enviando Mídia... (${Math.round(info.progress * 100)}%)`;
            });
        }
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        if (!document.getElementById('product').value || !ratingInput.value) {
            alert('Por favor, selecione o produto e dê uma nota clicando nas estrelas.');
            return; 
        }
        
        submitBtn.disabled = true;
        preloader.classList.add('visible'); 
        moonAnimation.style.display = 'block';
        errorFeedback.style.display = 'none';
        preloaderText.textContent = widget.value() ? 'Enviando Mídia...' : 'Salvando depoimento...';

        try {
            // ETAPA 1: Lidar com upload corretamente
            let mediaUrlsString = '';
            const upload = widget.value();

            if (upload) {
                const fileInfo = await upload.promise();

                if (fileInfo.files) {
                    // Vários arquivos
                    mediaUrlsString = fileInfo.files().map(file => file.cdnUrl).join(',');
                } else {
                    // Apenas um arquivo
                    mediaUrlsString = fileInfo.cdnUrl;
                }
            }

            // ETAPA 2: Salvar no Firebase
            preloaderText.textContent = 'Salvando depoimento...';
            const newTestimonial = {
                name: document.getElementById('name').value,
                role: document.getElementById('role').value,
                childName: document.getElementById('childName').value,
                productName: document.getElementById('product').value,
                testimonial: document.getElementById('testimonial').value,
                rating: parseInt(ratingInput.value),
                media: mediaUrlsString,
                createdAt: serverTimestamp()
            };
            await addDoc(collection(db, "depoimentos"), newTestimonial);

            // ETAPA 3: Sucesso
            preloader.classList.remove('visible');
            form.style.display = 'none';
            successMessage.style.display = 'block';

        } catch (error) {
            // ETAPA 4: Captura de qualquer erro
            console.error("Ocorreu um erro no envio: ", error);
            moonAnimation.style.display = 'none';
            preloaderText.textContent = '';
            errorFeedback.style.display = 'block';
        }
    });

    retryBtn.addEventListener('click', () => {
        preloader.classList.remove('visible');
        submitBtn.disabled = false;
    });
</script>

</body>
</html>

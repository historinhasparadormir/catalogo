<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deixe seu Depoimento - Historinhas para Dormir</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #a2d2ff; /* Azul bebê */
            --cor-secundaria: #ffafcc; /* Rosa suave */
            --cor-texto: #555;
            --fonte-principal: 'Nunito', sans-serif;
        }
        body {
            font-family: var(--fonte-principal);
            background-color: #fdf4f5;
            background-image: url('https://www.transparenttextures.com/patterns/light-paper-fibers.png');
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .form-container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px 40px;
            max-width: 500px;
            width: 100%;
        }
        h1, h2 {
            color: var(--cor-primaria);
            text-align: center;
            font-weight: 800;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--cor-texto);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: var(--fonte-principal);
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }
        .star {
            font-size: 2.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }
        .star:hover, .star.selected {
            color: #ffdd57;
            transform: scale(1.2);
        }
        .submit-btn, .view-testimonials-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background-image: linear-gradient(45deg, var(--cor-primaria), var(--cor-secundaria));
            color: white;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .submit-btn:hover, .view-testimonials-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(162, 210, 255, 0.5);
        }
        .submit-btn:disabled {
            background-image: none;
            background-color: #ccc;
            cursor: not-allowed;
        }
        /* --- INÍCIO DA ALTERAÇÃO: MENSAGEM DE SUCESSO MELHORADA --- */
        #success-message {
            text-align: center;
            display: none;
        }
        #success-message p {
            color: var(--cor-texto);
            font-size: 1.1rem;
        }
        .view-testimonials-btn {
            margin-top: 20px;
            font-size: 1rem;
        }
        /* --- FIM DA ALTERAÇÃO --- */
    </style>
</head>
<body>
    <div class="form-container">
        <form id="testimonialForm">
            <h1>Conte sua História! ✨</h1>
            <div class="form-group">
                <label for="name">Seu nome completo:</label>
                <input type="text" id="name" required>
            </div>
            <div class="form-group">
                <label for="role">Você é o pai ou a mãe?</label>
                <select id="role" required>
                    <option value="Pai">Pai</option>
                    <option value="Mãe">Mãe</option>
                </select>
            </div>
            <div class="form-group">
                <label for="childName">Nome do(a) seu(sua) filho(a):</label>
                <input type="text" id="childName" required>
            </div>
            <div class="form-group">
                <label for="product">Qual produto você comprou?</label>
                <select id="product" required>
                    <option value="" disabled selected>Escolha um produto...</option>
                    <option value="Livrinho 32 Historinhas para Dormir">Livrinho 32 Historinhas para Dormir</option>
                    <option value="32 Contos de Fadas Infantil">32 Contos de Fadas Infantil</option>
                    <option value="Livrinho para Colorir Mundo Fofinho">Livrinho para Colorir Mundo Fofinho</option>
                </select>
            </div>
            <div class="form-group">
                <label for="testimonial">Seu depoimento (máx. 200 caracteres):</label>
                <textarea id="testimonial" maxlength="200" required></textarea>
            </div>
            <div class="form-group">
                <label>Sua nota:</label>
                <div class="star-rating">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <input type="hidden" id="rating" required>
            </div>
            <div class="form-group">
                <label>Envie uma foto ou vídeo (opcional):</label>
                <input type="hidden" role="uploadcare-uploader" data-multiple="true" data-multiple-max="5" />
            </div>
            <button type="submit" class="submit-btn">Enviar Depoimento</button>
        </form>
        <!-- --- INÍCIO DA ALTERAÇÃO: ESTRUTURA DA MENSAGEM DE SUCESSO --- -->
        <div id="success-message">
            <h2>Obrigado! ✨</h2>
            <p>Seu depoimento foi enviado com sucesso e logo aparecerá na nossa página!</p>
            <a href="depoimentos.html" class="view-testimonials-btn">Ver todos os depoimentos</a>
        </div>
        <!-- --- FIM DA ALTERAÇÃO --- -->
    </div>

    <script>
        UPLOADCARE_PUBLIC_KEY = 'a45c2febeabd4d38ab78';
    </script>
    <script charset="utf-8" src="https://ucarecdn.com/libs/widget/3.x/uploadcare.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID",
            measurementId: "SEU_MEASUREMENT_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const stars = document.querySelectorAll('.star');
        const ratingInput = document.getElementById('rating');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = star.getAttribute('data-value');
                ratingInput.value = value;
                stars.forEach(s => {
                    s.classList.remove('selected');
                    if (s.getAttribute('data-value') <= value) s.classList.add('selected');
                });
            });
        });

        const form = document.getElementById('testimonialForm');
        const successMessage = document.getElementById('success-message');
        const widget = uploadcare.Widget('[role=uploadcare-uploader]');
        const submitBtn = form.querySelector('.submit-btn');

        // --- INÍCIO DA ALTERAÇÃO: LÓGICA DE PROGRESSO DO UPLOAD ---
        let fileGroup = null;

        widget.onChange(function(group) {
            fileGroup = group; // Armazena o objeto do grupo de arquivos quando o usuário seleciona algo
            if (group) {
                group.progress(info => {
                    // Atualiza o texto do botão com a porcentagem
                    const progress = Math.round(info.progress * 100);
                    submitBtn.textContent = `Enviando Mídia... (${progress}%)`;
                });
            }
        });
        // --- FIM DA ALTERAÇÃO ---

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;

            // Se não houver arquivos, o texto do botão muda imediatamente
            if (!fileGroup) {
                 submitBtn.textContent = 'Salvando depoimento...';
            }

            widget.value().done(async function(fileInfo) {
                // Quando o upload termina, o texto muda para "Salvando"
                submitBtn.textContent = 'Salvando depoimento...';

                const mediaUrls = fileInfo ? fileInfo.files().map(file => file.cdnUrl) : [];
                
                const newTestimonial = {
                    name: document.getElementById('name').value,
                    role: document.getElementById('role').value,
                    childName: document.getElementById('childName').value,
                    productName: document.getElementById('product').value,
                    testimonial: document.getElementById('testimonial').value,
                    rating: parseInt(ratingInput.value),
                    media: mediaUrls,
                    createdAt: serverTimestamp()
                };

                try {
                    await addDoc(collection(db, "depoimentos"), newTestimonial);
                    form.style.display = 'none';
                    successMessage.style.display = 'block';
                } catch (error) {
                    console.error("Erro ao adicionar o documento: ", error);
                    alert("Ocorreu um erro. Tente novamente.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar Depoimento';
                }
            });
        });
    </script>
</body>
</html>

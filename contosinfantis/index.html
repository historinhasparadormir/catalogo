        /* Estilos do seletor */

        select {

        /* Estilos do slider */
        .slideshow-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            margin: auto;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            aspect-ratio: 4 / 3;
        }

        .slides {
            display: flex;
            width: 600%; /* Corrigido para 6 slides */
            height: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            width: 16.666%; /* Corrigido para 6 slides (100% / 6) */
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .slideshow-container input {
            display: none;
        }

        /* Navegao do slider */
        .navigation {
            position: absolute;
            top: 50%;
            width: 100%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .navigation label {
            display: none;
            cursor: pointer;
            position: absolute;
            top: 0;
            padding: 15px;
            background-color: rgba(143, 188, 143, 0.7);
            color: white;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
            transition: background-color 0.3s ease;
            pointer-events: auto;
        }

        .navigation label.prev {
            left: 0;
            border-radius: 0 50px 50px 0;
        }

        .navigation label.next {
            right: 0;
            border-radius: 50px 0 0 50px;
        }

        .navigation label:hover {
            background-color: rgba(119, 157, 119, 1);
        }

        /* Lgica do slider */
        #slide1:checked ~ .slides { transform: translateX(0%); }
        #slide2:checked ~ .slides { transform: translateX(-16.666%); } /* Corrigido */
        #slide3:checked ~ .slides { transform: translateX(-33.333%); } /* Corrigido */
        #slide4:checked ~ .slides { transform: translateX(-50%); } /* Corrigido */
        #slide5:checked ~ .slides { transform: translateX(-66.666%); } /* Corrigido */
        #slide6:checked ~ .slides { transform: translateX(-83.333%); } /* Adicionado */

        #slide1:checked ~ .navigation .next[for="slide2"],
        #slide1:checked ~ .navigation .prev[for="slide6"] { display: block; }
        
        #slide2:checked ~ .navigation .next[for="slide3"],
        #slide2:checked ~ .navigation .prev[for="slide1"] { display: block; }

        #slide3:checked ~ .navigation .next[for="slide4"],
        #slide3:checked ~ .navigation .prev[for="slide2"] { display: block; }

        #slide4:checked ~ .navigation .next[for="slide5"],
        #slide4:checked ~ .navigation .prev[for="slide3"] { display: block; }

        #slide5:checked ~ .navigation .next[for="slide6"],
        #slide5:checked ~ .navigation .prev[for="slide4"] { display: block; }
        
        #slide6:checked ~ .navigation .next[for="slide1"],
        #slide6:checked ~ .navigation .prev[for="slide5"] { display: block; }

    </style>
</head>

    <script>
        // Lgica do slider automtico
        document.addEventListener('DOMContentLoaded', function() {
            const slideInterval = 3000;
            let autoSlideTimer;
            const sliderContainer = document.querySelector('.slideshow-container');
            const totalSlides = 6; // Adicionado: Total de slides

            function startAutoSlider() {
                clearInterval(autoSlideTimer);
                autoSlideTimer = setInterval(() => {
                    const currentRadio = document.querySelector('.slideshow-container input[type="radio"]:checked');
                    let nextRadio = currentRadio.nextElementSibling;

                    // Encontra o prximo radio, ignorando outros elementos
                    while (nextRadio && nextRadio.nodeName !== 'INPUT') {
                        nextRadio = nextRadio.nextElementSibling;
                    }
                    
                    // Se no houver prximo, volta para o primeiro
                    if (!nextRadio || nextRadio.id === `slide${totalSlides + 1}`) {
                        nextRadio = document.querySelector('#slide1');
                    }
                    nextRadio.checked = true;
                }, slideInterval);
            }

            sliderContainer.addEventListener('click', startAutoSlider);
            startAutoSlider();
        });

        // Lgica do boto COMPRAR
    
    function comprar() {
        const versao = document.getElementById('versao').value;
        if (!versao) {
            alert("Por favor, selecione uma vers&atilde;o antes de comprar.");
            return;
        }

        // Rastreia o clique no Google Analytics
        gtag('event', 'clique', {
            'event_category': 'compra',
            'event_label': 'compra_contos_infantis_' + versao
        });

        if (versao === "tradicional") {
            window.location.href = "https://loja.uiclap.com/titulo/ua113287";
        } else {
            // Define o nmero de telefone e a mensagem do pedido
            const numeroTelefone = "5519991950005";
            const mensagem = "Ol, gostaria de fazer um pedido da Verso Premium do livro Contos Infantis Para Dormir no valor de 35,99. Qual o prximo passo para finalizar a compra?";

            // Codifica a mensagem para o formato de URL
            const urlMensagem = encodeURIComponent(mensagem);

            // Constri o link completo do WhatsApp
            const whatsappLink = `https://wa.me/${numeroTelefone}?text=${urlMensagem}`;

            // Redireciona o usurio para o WhatsApp com a mensagem pr-preenchida
            window.location.href = whatsappLink;
        }
    }

        // Lgica do player de msica
        document.addEventListener('DOMContentLoaded', function() {
            const musicPlayerContainer = document.getElementById('music-player-container');
            const playPauseButton = document.getElementById('play-pause-button');
            const backgroundMusic = document.getElementById('background-music');

            playPauseButton.addEventListener('click', function() {
                if (backgroundMusic.paused) {
                    backgroundMusic.play();
                    musicPlayerContainer.classList.add('playing');
                } else {
                    backgroundMusic.pause();
                    musicPlayerContainer.classList.remove('playing');
                }
            });
        });
    </script>

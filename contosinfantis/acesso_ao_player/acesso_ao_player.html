<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player de Músicas - Disquinhos</title>

    <style>
        /* Estilos gerais */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #C8E6C9; /* Mantém a cor de fundo do site original */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0; /* Adiciona um respiro para telas menores */
        }

        .container {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            max-width: 420px;
            width: 100%;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .header-img {
            width: 100%;
            display: block;
        }

        /* ----- ESTILOS DO PLAYER DE ÁUDIO ----- */
        .audio-player-wrapper {
            background-color: #f7f7f7;
            border-radius: 15px;
            padding: 15px;
            margin: 20px auto;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: #333;
            text-align: left;
        }

        .audio-player-wrapper h3 {
            font-size: 1.2em; /* Título um pouco maior */
            margin-top: 0;
            margin-bottom: 10px;
            color: #4f8058;
            text-align: center;
        }

        .current-song-info {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: center;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 5px; /* Diminuído para juntar com o tempo */
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4f8058;
            border-radius: 5px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #777;
            margin-bottom: 15px;
        }

        .playback-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .playback-buttons button, .volume-controls button, .repeat-button {
            background-color: #4f8058;
            border: none;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            transition: background-color 0.2s ease;
        }

        .playback-buttons button:hover, .volume-controls button:hover, .repeat-button:hover {
            background-color: #6a9f73;
        }

        .playback-buttons button svg, .volume-controls button svg, .repeat-button svg {
            fill: white;
            width: 18px;
            height: 18px;
        }

        .playback-buttons .main-play-pause {
            width: 50px; /* Botão principal maior */
            height: 50px;
        }
        .playback-buttons .main-play-pause svg {
             width: 24px;
             height: 24px;
        }

        .repeat-button {
            background-color: #a0a0a0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
        }
        .repeat-button.active {
            background-color: #4f8058;
        }
        .repeat-button svg {
            width: 16px;
            height: 16px;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .volume-controls input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 5px;
            outline: none;
        }

        .volume-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4f8058;
            cursor: pointer;
        }
        .volume-controls input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4f8058;
            cursor: pointer;
        }

        .playlist-title {
            text-align: center;
            color: #4f8058;
            margin-top: 20px;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .playlist-container {
            border-top: 1px solid #eee;
            padding-top: 10px;
            max-height: 250px; /* Mais espaço para a lista de músicas */
            overflow-y: auto;
            text-align: left;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            border-radius: 8px;
            transition: background-color 0.2s ease;
        }

        .playlist-item:hover {
            background-color: #e6f3e6;
        }

        .playlist-item.active-song {
            background-color: #d1ead1;
            font-weight: bold;
            color: #4f8058;
        }

        .playlist-item-index {
            margin-right: 12px;
            font-size: 0.85em;
            color: #777;
            min-width: 20px; /* Alinhamento dos números */
        }
        .playlist-item.active-song .playlist-item-index {
            color: #4f8058;
        }

        .playlist-item-title {
            font-size: 0.9em;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="ContosParaOuvir.jpg" alt="Contos Infantis" class="header-img">

        <div class="audio-player-wrapper">
          <h3>Player de Músicas</h3>
            <audio id="audio-player" src="" type="audio/mp3"></audio>

            <div class="current-song-info" id="current-song-title">Selecione uma música para começar</div>

            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-info">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="playback-buttons">
                <button id="prev-btn" title="Anterior">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="play-pause-btn" class="main-play-pause" title="Reproduzir/Pausar">
                    <svg class="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg class="pause-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="next-btn" title="Próxima">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm9-12v12h2V6h-2z"/></svg>
                </button>
                <button id="repeat-btn" class="repeat-button" title="Repetir">
                      <svg class="repeat-all-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                      <svg class="repeat-one-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
                </button>
            </div>

            <div class="volume-controls">
                <button id="mute-btn" title="Mudo">
                    <svg class="volume-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    <svg class="mute-icon" style="display:none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                </button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
            </div>
            
            <h4 class="playlist-title">Lista de Reprodução</h4>
            <div class="playlist-container" id="playlist-container">
          </div>
      </div>
</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audioPlayer = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const repeatBtn = document.getElementById('repeat-btn');
            const muteBtn = document.getElementById('mute-btn');
            const volumeSlider = document.getElementById('volume-slider');
            const progressBarContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const currentTimeSpan = document.getElementById('current-time');
            const durationSpan = document.getElementById('duration');
            const currentSongTitle = document.getElementById('current-song-title');
            const playlistContainer = document.getElementById('playlist-container');
            
            const playIcon = playPauseBtn.querySelector('.play-icon');
            const pauseIcon = playPauseBtn.querySelector('.pause-icon');
            const repeatAllIcon = repeatBtn.querySelector('.repeat-all-icon');
            const repeatOneIcon = repeatBtn.querySelector('.repeat-one-icon');
            const volumeIcon = muteBtn.querySelector('.volume-icon');
            const muteIcon = muteBtn.querySelector('.mute-icon');

            const audioFiles = [
                "disquinho - A Bela Adormecida.mp3",
                "disquinho - A Bela e a Fera.mp3",
                "disquinho - A Cigarra e a Formiga.mp3",
                "disquinho - A Festa no Céu.mp3",
                "disquinho - A Flautinha Encantada.mp3",
                "disquinho - A Formiguinha e a Neve.mp3",
                "disquinho - A Formiguinha e a Pomba.mp3",
                "disquinho - A Gata Borralheira.mp3",
                "disquinho - A Lebre e a Tartaruga.mp3",
                "disquinho - Aladim e a Lâmpada Maravilhosa.mp3",
                "disquinho - Branca de Neve e os Sete Anoes.mp3",
                "disquinho - Briga no Galinheiro.mp3",
                "disquinho - Dona Baratinha.mp3",
                "disquinho - Dona Galinha e seus Pintinhos.mp3",
                "disquinho - O Bonequinho de Neve.mp3",
                "disquinho - O Burrinho e o Sal.mp3",
                "disquinho - O Burrinho Tró-ló-ló.mp3",
                "disquinho - O Burro e o Grilo.mp3",
                "disquinho - O Cabra Cabrez.mp3",
                "disquinho - O Carvalho e o Junco.mp3",
                "disquinho - O Chapeuzinho Vermelho.mp3",
                "disquinho - O Cisne Vaidoso.mp3",
                "disquinho - O Gato de Botas.mp3",
                "disquinho - O Golfinho e o Leão.mp3",
                "disquinho - O Leão e o Ratinho.mp3",
                "disquinho - O Lobo e os 3 Cabritinhos.mp3",
                "disquinho - O macaco e a velha.mp3",
                "disquinho - O Patinho Feio.mp3",
                "disquinho - O Pequeno Polegar.mp3",
                "disquinho - O Soldadinho De Chumbo.mp3",
                "disquinho - Os 3 Porquinhos.mp3",
                "disquinho - Os 4 Heróis.mp3",
                "disquinho - Os Dois Sapos.mp3",
                "disquinho - Pedro e o Lobo.mp3",
                "disquinho - Pinóquio.mp3",
                "disquinho - Rapunzel.mp3",
                "disquinho - Saci Pererê.mp3",
                "disquinho - A Goela do Inferno 1.mp3",
                "disquinho - História Da Baratinha.mp3",
                "disquinho - João Maria.mp3"
            ];
            const audioPath = ""; // Vazio, pois os arquivos estão na mesma pasta

            let currentTrackIndex = 0;
            const REPEAT_NONE = 0;
            const REPEAT_ALL = 1;
            const REPEAT_ONE = 2;
            let repeatMode = REPEAT_ALL;

            function formatTime(seconds) {
                const min = Math.floor(seconds / 60);
                const sec = Math.floor(seconds % 60);
                return `${min}:${sec < 10 ? '0' : ''}${sec}`;
            }

            function loadTrack(index) {
                if (index >= 0 && index < audioFiles.length) {
                    currentTrackIndex = index;
                    audioPlayer.src = audioPath + audioFiles[currentTrackIndex];
                    currentSongTitle.textContent = audioFiles[currentTrackIndex].replace("disquinho - ", "").replace(".mp3", "");
                    audioPlayer.load();
                    updatePlaylistHighlight();
                }
            }

            function playTrack() {
                audioPlayer.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            }

            function pauseTrack() {
                audioPlayer.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }

            function togglePlayPause() {
                if (audioPlayer.paused) {
                    playTrack();
                } else {
                    pauseTrack();
                }
            }

            function nextTrack() {
                let nextIndex = (currentTrackIndex + 1) % audioFiles.length;
                loadTrack(nextIndex);
                playTrack();
            }

            function prevTrack() {
                let prevIndex = (currentTrackIndex - 1 + audioFiles.length) % audioFiles.length;
                loadTrack(prevIndex);
                playTrack();
            }

            function updateProgressBar() {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.style.width = progress + '%';
                currentTimeSpan.textContent = formatTime(audioPlayer.currentTime);
            }

            function setProgressBar(e) {
                const width = progressBarContainer.clientWidth;
                const clickX = e.offsetX;
                if(audioPlayer.duration) {
                    audioPlayer.currentTime = (clickX / width) * audioPlayer.duration;
                }
            }

            function updateVolume() {
                audioPlayer.volume = volumeSlider.value;
                audioPlayer.muted = volumeSlider.value == 0;
                updateMuteIcon();
            }
            
            function updateMuteIcon() {
                if (audioPlayer.muted || audioPlayer.volume === 0) {
                    volumeIcon.style.display = 'none';
                    muteIcon.style.display = 'block';
                    muteBtn.title = "Ativar som";
                } else {
                    volumeIcon.style.display = 'block';
                    muteIcon.style.display = 'none';
                    muteBtn.title = "Mudo";
                }
            }

            function toggleMute() {
                audioPlayer.muted = !audioPlayer.muted;
                if(audioPlayer.muted) {
                    volumeSlider.value = 0;
                } else if (volumeSlider.value == 0) {
                    volumeSlider.value = 1; // Volta ao volume máximo se estava em 0
                }
                audioPlayer.volume = volumeSlider.value;
                updateMuteIcon();
            }

            function toggleRepeatMode() {
                repeatMode = (repeatMode + 1) % 3;
                updateRepeatButton();
            }

            function updateRepeatButton() {
                repeatBtn.classList.remove('active');
                repeatAllIcon.style.display = 'none';
                repeatOneIcon.style.display = 'none';

                if (repeatMode === REPEAT_ALL) {
                    repeatAllIcon.style.display = 'block';
                    repeatBtn.title = "Repetir Playlist";
                    repeatBtn.classList.add('active');
                } else if (repeatMode === REPEAT_ONE) {
                    repeatOneIcon.style.display = 'block';
                    repeatBtn.title = "Repetir Música Atual";
                    repeatBtn.classList.add('active');
                } else {
                    repeatAllIcon.style.display = 'block';
                    repeatBtn.title = "Não Repetir";
                }
            }

            function handleTrackEnd() {
                if (repeatMode === REPEAT_ONE) {
                    playTrack();
                } else if (repeatMode === REPEAT_ALL) {
                    nextTrack();
                } else {
                     if (currentTrackIndex < audioFiles.length - 1) {
                         nextTrack();
                     } else {
                         pauseTrack();
                     }
                }
            }

            function populatePlaylist() {
                playlistContainer.innerHTML = '';
                audioFiles.forEach((file, index) => {
                    const div = document.createElement('div');
                    div.classList.add('playlist-item');
                    div.dataset.index = index;
                    div.innerHTML = `
                        <span class="playlist-item-index">${index + 1}.</span>
                        <span class="playlist-item-title">${file.replace("disquinho - ", "").replace(".mp3", "")}</span>
                    `;
                    div.addEventListener('click', () => {
                        loadTrack(index);
                        playTrack();
                    });
                    playlistContainer.appendChild(div);
                });
                updatePlaylistHighlight();
            }

            function updatePlaylistHighlight() {
                document.querySelectorAll('.playlist-item').forEach(item => {
                    item.classList.remove('active-song');
                });
                const activeItem = document.querySelector(`.playlist-item[data-index="${currentTrackIndex}"]`);
                if (activeItem) {
                    activeItem.classList.add('active-song');
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            // Event Listeners
            playPauseBtn.addEventListener('click', togglePlayPause);
            prevBtn.addEventListener('click', prevTrack);
            nextBtn.addEventListener('click', nextTrack);
            repeatBtn.addEventListener('click', toggleRepeatMode);
            muteBtn.addEventListener('click', toggleMute);
            volumeSlider.addEventListener('input', updateVolume);
            progressBarContainer.addEventListener('click', setProgressBar);
            audioPlayer.addEventListener('timeupdate', updateProgressBar);
            audioPlayer.addEventListener('loadedmetadata', () => {
                durationSpan.textContent = formatTime(audioPlayer.duration);
                updateProgressBar();
            });
            audioPlayer.addEventListener('ended', handleTrackEnd);
            audioPlayer.addEventListener('volumechange', updateMuteIcon);

            // Inicialização
            populatePlaylist();
            loadTrack(currentTrackIndex);
            updateRepeatButton();
            updateMuteIcon();
        });
    </script>
</body>
</html>

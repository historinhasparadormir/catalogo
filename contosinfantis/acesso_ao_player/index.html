<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login - Acesso ao Player</title>
    <style>
        /* Estilos gerais (mesmo padrão do site) */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #C8E6C9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
        }
        .container {
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            max-width: 420px;
            width: 100%;
            box-shadow: 0px 5px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .header-img { width: 100%; display: block; }
        .login-wrapper {
            background-color: #f7f7f7;
            border-radius: 15px;
            padding: 25px;
            margin: 20px auto;
            max-width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #333;
            text-align: left;
        }
        .login-wrapper h3 {
            font-size: 1.3em;
            margin-top: 0;
            margin-bottom: 20px;
            color: #4f8058;
            text-align: center;
        }
        .input-group { margin-bottom: 15px; }
        .input-group label {
            display:block; margin-bottom:5px; font-weight:bold; color:#555; font-size:0.9em;
        }
        .input-group input {
            width:100%; padding:12px; font-size:1rem; border-radius:8px; border:1px solid #ccc; outline:none; box-sizing:border-box;
            transition:border-color .2s ease;
        }
        .input-group input:focus { border-color:#4f8058; }
        #captcha-group {
            display:flex; align-items:center; justify-content:space-between; background:#e9e9e9; padding:10px; border-radius:8px;
        }
        #captcha-question { font-weight:bold; font-size:1.1em; color:#333; user-select:none; }
        #captcha-group input { width:80px; text-align:center; font-weight:bold; }
        .login-btn {
            background-color:#4f8058; color:white; font-size:1.2rem; font-weight:bold; border:none; padding:15px; border-radius:8px; cursor:pointer;
            width:100%; margin-top:20px; transition:background-color .2s ease;
        }
        .login-btn:hover { background-color:#6a9f73; }
        .error-message {
            display:none; color:#D32F2F; background:#FFCDD2; border:1px solid #EF9A9A; border-radius:8px; padding:10px; margin-top:20px;
            font-size:0.9em; text-align:center;
        }
        /* Pequena nota de rodapé */
        .note { font-size:0.85rem; color:#666; text-align:center; padding:10px 20px 20px; }
    </style>
</head>
<body>
    <div class="container">
        <img src="ContosParaOuvir.jpg" alt="Contos Infantis" class="header-img">

        <div class="login-wrapper">
            <h3>Acesso Restrito</h3>
            <form id="login-form" novalidate>
                <div class="input-group">
                    <label for="username">Usuário:</label>
                    <input type="text" id="username" name="username" required autocomplete="username" />
                </div>
                <div class="input-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" />
                </div>
                <div class="input-group">
                    <label for="captcha">Para continuar, resolva a soma:</label>
                    <div id="captcha-group">
                        <span id="captcha-question"></span>
                        <input type="number" id="captcha" name="captcha" required />
                    </div>
                </div>

                <p id="error-message" class="error-message"></p>

                <button type="submit" class="login-btn">Entrar</button>
            </form>
        </div>

   
    </div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const loginForm = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const captchaQuestion = document.getElementById('captcha-question');
    const captchaInput = document.getElementById('captcha');
    const errorMessage = document.getElementById('error-message');

    const users = [
        { username: "cristiane", password: "adamomeuamor", name: "Cris & Noah", expirationDate: "2025-09-15" },
        { username: "maria_contos", password: "OutraSenhaForte!", name: "Maria Contos", expirationDate: "2025-09-25" },
        { username: "admin_test", password: "adminPass1", name: "Administrador Teste", expirationDate: "2025-09-14" },
        { username: "euexistoporvoce", password: "102030", name: "Ádamo", expirationDate: "2025-10-11" }
    ];

    let captchaCorrectAnswer;

    function generateCaptcha() {
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10);
        captchaCorrectAnswer = num1 + num2;
        captchaQuestion.textContent = `${num1} + ${num2} = `;
        captchaInput.value = "";
    }

    function showError(message) {
        errorMessage.textContent = message;
        errorMessage.style.display = 'block';
        setTimeout(() => { errorMessage.style.display = 'none'; }, 6000);
        generateCaptcha();
    }

    loginForm.addEventListener('submit', function (event) {
        event.preventDefault();

        const enteredUser = usernameInput.value.trim();
        const enteredPass = passwordInput.value;
        const enteredCaptcha = parseInt(captchaInput.value, 10);

        if (isNaN(enteredCaptcha) || enteredCaptcha !== captchaCorrectAnswer) {
            showError('O resultado da soma está incorreto.');
            return;
        }

        let authenticatedUser = null;
        for (const user of users) {
            if (user.username === enteredUser && user.password === enteredPass) {
                authenticatedUser = user;
                break;
            }
        }

        if (!authenticatedUser) {
            showError('Usuário ou senha inválidos. Tente novamente.');
            return;
        }
        
        // --- CORREÇÃO: Salvar as informações corretas no localStorage ---
        localStorage.setItem('loggedInUserName', authenticatedUser.name);
        localStorage.setItem('loggedInUserExpiration', authenticatedUser.expirationDate);
        // --- FIM DA CORREÇÃO ---

        window.location.href = 'acesso_ao_player.html';
    });

    generateCaptcha();
});
</script></body>
</html>
